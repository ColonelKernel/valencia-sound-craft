<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zach Scheffler — Data Scientist & ML Engineer</title>
    <!-- Matches ROUTE_META.home.description exactly (routeMeta.ts) so social
         scrapers that never execute JS see the same positioning as hydrated
         pages. -->
    <meta name="description" content="Data scientist and ML engineer in the San Francisco Bay Area, open to remote. Applied data work across the World Bank, NORC, and Rios Partners, plus production ML and audio software.">
    <meta name="author" content="Zach Scheffler" />
    <!-- Unknown paths serve dist/404.html (no canonical, noindex), so the
         root shell is free to carry the homepage canonical. -->
    <link rel="canonical" href="https://zachscheffler.com/">
    <meta name="theme-color" content="#121212">

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zach Scheffler">
    <meta property="og:url" content="https://zachscheffler.com/" />
    <!-- Generated by scripts/generate-og-card.mjs from the site's own tokens
         and typefaces; src/app/ogCard.test.ts fails if the headline moves and
         the card is not regenerated. A share preview is read at thumbnail size
         in a feed, where type survives and a photograph does not. -->
    <meta property="og:image" content="https://zachscheffler.com/og-image.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zach Scheffler — Data Scientist &amp; ML Engineer, San Francisco Bay Area, open to new roles">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://zachscheffler.com/og-image.png">
    
  
  
  
  <link rel="preload" as="image" href="/hero-photo.webp" imagesrcset="/hero-photo-750.webp 750w, /hero-photo.webp 1400w" imagesizes="100vw" fetchpriority="high">
  <link rel="preload" href="/fonts/SpaceGrotesk-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/DMSans-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta property="og:title" content="Zach Scheffler — Data Scientist & ML Engineer">
  <meta name="twitter:title" content="Zach Scheffler — Data Scientist & ML Engineer">
  <meta property="og:description" content="Data scientist and ML engineer in the San Francisco Bay Area, open to remote. Applied data work across the World Bank, NORC, and Rios Partners, plus production ML and audio software.">
  <meta name="twitter:description" content="Data scientist and ML engineer in the San Francisco Bay Area, open to remote. Applied data work across the World Bank, NORC, and Rios Partners, plus production ML and audio software.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
