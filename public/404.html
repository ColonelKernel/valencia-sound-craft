<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1b14" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — Zach Scheffler Research</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #f2f1eb;
        --ink: #10231b;
        --night: #0a1b14;
        --acid: #c9f873;
        --coral: #b54534;
        --white: #fbfcf8;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: var(--night);
        color: var(--white);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(1.5rem, 4vw, 4rem);
        background:
          linear-gradient(rgba(201, 248, 115, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(201, 248, 115, 0.06) 1px, transparent 1px),
          var(--night);
        background-size: 4rem 4rem;
      }

      .wordmark {
        display: inline-flex;
        align-items: baseline;
        gap: 0.25rem;
        color: var(--white);
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        text-decoration: none;
      }

      .wordmark span {
        color: var(--coral);
      }

      main {
        max-width: 920px;
        margin-top: 8rem;
      }

      .kicker {
        margin: 0;
        color: var(--acid);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.69rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      h1 {
        margin: 1.2rem 0;
        font-family: "Helvetica Neue", "Avenir Next", Arial, sans-serif;
        font-size: clamp(3.2rem, 8vw, 8rem);
        font-weight: 680;
        letter-spacing: -0.065em;
        line-height: 0.92;
      }

      main > p:not(.kicker) {
        max-width: 680px;
        margin: 0 0 2rem;
        color: rgba(255, 255, 255, 0.62);
        font-size: 1rem;
        line-height: 1.7;
      }

      .button {
        display: inline-flex;
        min-height: 2.8rem;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        padding: 0.78rem 1.25rem;
        border-radius: 999px;
        background: var(--white);
        color: var(--night);
        font-size: 0.82rem;
        font-weight: 750;
        text-decoration: none;
      }

      .button:focus-visible {
        outline: 3px solid var(--acid);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .button {
          transition: background 180ms ease, transform 180ms ease;
        }

        .button:hover {
          transform: translateY(-2px);
        }
      }
    </style>
  </head>
  <body>
    <a class="wordmark" href="/" aria-label="Zach Scheffler, home">ZS<span aria-hidden="true">/</span>Research</a>
    <main>
      <p class="kicker">404 / Page not found</p>
      <h1>Page not found. This portfolio has been consolidated.</h1>
      <p>
        The requested route belonged to an earlier version of the site. The current dossier focuses on
        DAW state, intelligent music production, and human–AI performance systems.
      </p>
      <a class="button" href="/">Return home to the research dossier <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
