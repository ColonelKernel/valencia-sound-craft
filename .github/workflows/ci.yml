name: CI

on:
  push:
    branches:
      - portfolio/rebuild
      - main
  # The site claims "nothing merges without passing" these gates. Without a
  # pull_request trigger that was only true of direct pushes.
  pull_request:
    branches:
      - portfolio/rebuild
      - main
  workflow_dispatch:

# PUBLIC values, shipped verbatim in the site bundle — not secrets. They must
# be present at build time or the contact form compiles out entirely
# (BACKEND_CONFIGURED in src/components/Contact.tsx).
env:
  VITE_SUPABASE_URL: https://uqcjivqzilisngdwtdzl.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hzOztH5IFInSeS1yIJnCNA_8LpEsKTD

jobs:
  gates:
    name: Lint, typecheck, test, budget, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Bundle budget (initial graph ≤ 150 KB gzip)
        run: npm run budget

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright e2e
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run e2e

  lighthouse:
    name: Lighthouse (accessibility floor 1.0)
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This job exists because three places on the site told readers it did:
      # /tools, /projects and the homepage all claimed a perfect Lighthouse
      # accessibility score gated every commit, and nothing in CI ran it. The
      # claim is now true. lighthouserc.cjs starts its own preview server and
      # gates accessibility at 1.0 as an error across all sixteen routes;
      # performance and the paint metrics stay warnings, so a slow runner
      # cannot turn a perf wobble into a red build.
      #
      # No browser install step: chrome-launcher finds the Chrome that
      # ubuntu-latest ships, which is how every local run of this same command
      # resolves one too. Pinning CHROME_PATH to Playwright's chromium was
      # tried and rejected — it adds a second browser toolchain to save
      # nothing.
      - name: Lighthouse CI
        run: npm run lighthouse

      # The HTML reports are the whole point on a failure: without them a red
      # build says "accessibility 0.98" and not which element caused it.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
